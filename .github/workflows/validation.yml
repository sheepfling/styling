name: Validate shared styling

on:
  push:
  pull_request:

jobs:
  public-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core librsvg2-bin poppler-utils \
            texlive-xetex texlive-pictures texlive-latex-extra
      - name: Install Python preview dependencies
        run: python -m pip install -e '.[preview]'
      - name: Check recipe toolchain
        run: |
          python scripts/doctor.py --mode recipe
          python scripts/doctor.py --mode native-tex
          python scripts/doctor.py --mode native-vector
      - name: Validate public source and renderer behavior
        run: python -m unittest discover -s tests -q
      - name: Require native recipe integration
        run: |
          python -m unittest \
            tests.test_accent_registry.AccentRegistryTests.test_actual_shared_cli_builds_four_added_kinds_with_hashes_and_no_font_zip \
            tests.test_accent_registry.AccentRegistryTests.test_actual_03_cli_records_new_backend_geometry_and_version_boundary -v
      - name: Check synthetic intake and portfolio report
        run: |
          python scripts/validate_customer_intake.py examples/starter/customer-intake.json
          python scripts/report_portfolio_coverage.py --output /tmp/styling-portfolio-coverage.json
