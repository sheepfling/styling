[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepfling-styling"
version = "0.1.0"
description = "Source-aware contracts for isolated visual systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
preview = ["Pillow>=10", "pypdf>=5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sheepfling_styling*"]
